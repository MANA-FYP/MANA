name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest python3-pytest-cov python3-rosdep
      - name: Build and test ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          if [ -n "$(find src -name package.xml -print -quit)" ]; then
            rosdep init || true
            rosdep update
            rosdep install --from-paths src --ignore-src -y
            colcon build
            colcon test
            colcon test-result --verbose
          else
            echo "No ROS 2 packages in src/ yet, skipping colcon"
          fi
      - name: Run Python tests
        run: python3 -m pytest tests -v --cov --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
