name: Release

# Pushing a tag such as v0.1.0-mid runs every CI check first, then publishes the Docker image
# and creates the GitHub Release. Nothing is published if a check fails.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mana-fyp/mana:${{ github.ref_name }}

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Docker image: `docker pull ghcr.io/mana-fyp/mana:${{ github.ref_name }}`
