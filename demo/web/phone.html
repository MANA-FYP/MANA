<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b24">
  <title>MANA sensor host</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="phone">
  <div class="start" id="start">
    <h1>MANA sensor host</h1>
    <p>This phone sends its real sensors to the laptop. Tap start, then allow motion, location,
       camera and microphone when the browser asks.</p>
    <button id="startBtn">Start sensors</button>
  </div>

  <div class="top">
    <div class="brand">MANA<small>sensor host</small></div>
    <div class="conn off" id="conn">offline</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="dock">
  <div class="device stopped" id="device">
    <div class="label">Command from the decision layer</div>
    <div class="mode" id="mode">WAITING</div>
    <div class="why" id="why">Connect to the laptop to begin.</div>
  </div>

  <div class="buttons">
    <button class="btn stop" id="stopBtn">STOP</button>
    <button class="btn go" id="goBtn">GO</button>
  </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/phone.js"></script>
</body>
</html>
