<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f5f9">
  <title>MANA sensor host</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="phone">
  <div class="start" id="start">
    <h1>MANA sensor host</h1>
    <p>This phone sends its real sensors to the laptop. Tap start, then allow motion, location,
       camera and microphone when the browser asks.</p>
    <button id="startBtn">Start sensors</button>
  </div>

  <div class="ribbon"></div>
  <div class="top">
    <div class="brand">MANA <span>sensor host</span><small id="path">connecting</small></div>
    <span class="chip off" id="conn">offline</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="modes">
    <button class="mode-btn" data-button="automatic" data-mode="automatic">Automatic</button>
    <button class="mode-btn" data-button="manual" data-mode="manual">Manual</button>
  </div>

  <div class="buttons">
    <button class="btn stop" data-button="stop">STOP</button>
    <button class="btn go" data-button="go">GO</button>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/phone.js"></script>
</body>
</html>
