# Nav2 for the autopilot (#78): it drives the chair to a goal picked on the map, and its commands go
# through MANA like the supervisor's (cmd_vel/autopilot -> driver_select -> host, capped by the core).
# The map comes from slam_toolbox localising on a saved map (it publishes /map), and map -> odom from
# ekf_global (#43). Nav2's own localisation (AMCL) is not used. Speeds stay at or under the chair's
# top speed of 1.2 m/s; MANA lowers them further with its speed limit.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom  # the wheels and the gyro (odom:=wheels)
    bt_loop_duration: 10
    default_server_timeout: 1000  # ms: the planner answers late on a busy computer (20 timed out)
    wait_for_service_timeout: 5000
    navigators: ["navigate_to_pose"]
    # the tree is navigate_no_recovery.xml (the launch file gives its path): replanning and the
    # path follower, no recoveries or retries, so a goal that makes no progress for 60 s (a long
    # MANA stop) is aborted and has to be given again, rather than kept alive by spins and
    # back-ups that would set the chair off by itself when the stop lifts (Waqas, #187)
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    # MANA may stop the chair for a while (a person in the way, a stop said by the user): the
    # progress checker would abort the goal after its time, so it is given 60 s (see the README)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 60.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.5
      stateful: true
    # MPPI scores sampled trajectories with the full footprint, so it follows the lattice planner's
    # path round the east corner, where Regulated Pure Pursuit cut it and stopped (#78)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.6
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.8
      ax_max: 1.0
      ax_min: -1.0
      az_max: 2.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      prune_distance: 2.0
      transform_tolerance: 0.3
      enforce_path_inversion: false
      visualize: false
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # the chair with its tracks, base_link at its centre: the chassis and wheels are 0.92 m long,
      # but each track's sloped ends reach about 1.08 m out (models/mana_chair/model.sdf; core.yaml
      # front_tracks_m 1.1). In wheels mode the tracks are lifted 15 cm, which still leaves their
      # ends 0.25 to 0.5 m above the floor, under any wall, so the footprint is the tracks' length:
      # 2.2 m by 0.8 m (Waqas, #187)
      footprint: "[[1.1, 0.4], [1.1, -0.4], [-1.1, -0.4], [-1.1, 0.4]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 8.0
          obstacle_max_range: 7.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.2  # at least the footprint's circumscribed radius, 1.17 m
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[1.1, 0.4], [1.1, -0.4], [-1.1, -0.4], [-1.1, 0.4]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 8.0
          obstacle_max_range: 7.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.2  # at least the footprint's circumscribed radius, 1.17 m
        cost_scaling_factor: 4.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # a state lattice that plans with the chair's footprint and lets it turn on the spot (#187):
    # NavFn planned for a point, and the 2.2 m chair could not follow its path round a corner
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: false
      tolerance: 0.3
      max_planning_time: 5.0
      allow_reverse_expansion: false
      rotation_penalty: 5.0
      cost_penalty: 4.0  # keeps the path off the walls in the 1.4 m corridors (#78: 4 of 4 runs round the corner, 1 of 3 at 2.0)
      smooth_path: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
