# slam_toolbox placing the chair on a saved map of the indoor world (#43). The map is given with
# -p map_file_name:=PATH (the serialised pose graph, no extension); the chair starts where the
# map began (map_start_at_dock). Configure and activate it, as in mapping.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: localization
    map_start_at_dock: true
    resolution: 0.05
    max_laser_range: 11.5
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    map_update_interval: 2.0
    transform_publish_period: 0.05
    do_loop_closing: true
